<body>
    <!-- Navigacioni meni -->
    <header>
        <img src="bbballstats_logo.png" alt="logo" class="logo-img" />
        <div align="right">
            <a (click)="trenerPocetna()" class="linkButton">Početna</a>
            <a (click)="trenerIgraci()" class="linkButton">Igrači</a>
            <a (click)="logOut()" class="linkButton">Odjavi se</a>
        </div>
    </header>

    <div class="app-wrapper">

        <main class="app-content">
            <div class="izvestaj-wrapper">

                <div class="izvestaj-naslov">
                    Izveštaji za: {{ igrac.ime }} {{ igrac.prezime }}
                    <span *ngIf="igrac.broj">#{{ igrac.broj }}</span>
                </div>

                <!-- FORMA za novi izveštaj -->
                <div class="nova-izvestaj-box">
                    <div class="sekcija-naslov">Novi izveštaj</div>
                    <textarea [(ngModel)]="noviIzvestaj" placeholder="Napišite izveštaj o igraču..." rows="6"
                        class="izvestaj-textarea">
                    </textarea>
                    <div class="izvestaj-akcije">
                        <button (click)="sacuvajIzvestaj()" class="btn-sacuvaj">Sačuvaj izveštaj</button>
                    </div>
                    <div class="message" *ngIf="message">{{ message }}</div>
                </div>

                <!-- PRETHODNI izveštaji -->
                <div class="sekcija-naslov">Prethodni izveštaji</div>
                <div class="izvestaji-lista">
                    <div class="prazno" *ngIf="izvestaji.length === 0">Još nema izveštaja za ovog igrača</div>
                    <div class="izvestaj-kartica" *ngFor="let iz of izvestaji">
                        <div class="izvestaj-header">
                            <span class="izvestaj-datum">{{ iz.datum }}</span>
                            <button class="btn-obrisi" (click)="obrisiIzvestaj(iz.id)" title="Obriši">✕</button>
                        </div>
                        <div class="izvestaj-tekst" [class.skupljen]="!iz.otvoren">
                            {{ iz.tekst }}
                        </div>
                        <button *ngIf="iz.tekst.length > 150" class="btn-prosiri" (click)="otvoriIzvestaj(iz)">
                            {{ iz.otvoren ? 'Prikaži manje' : 'Prikaži više' }}
                        </button>
                    </div>
                </div>

            </div>
        </main>

    </div>

</body>
<footer>
    <div align="left">
        <img src="bbballstats_logo.png" alt="logo" class="logo-img" />
    </div>
    <div align="center">
        &copy; BBallStats, 2026
    </div>
    <div class="footer-contact" align="right">
        <a href="tel:+381628421563" class="linkButton"> <img src="logoPhone_white.png" alt="logoPhone_white"
                class="email-icon"> +381628421563 </a> <br>
        <a href="mailto: bballstatsinfo@gmail.com" class="linkButton"> <img src="logoMail_white.png"
                alt="logoMail_white" class="email-icon"> bballstatsinfo@gmail.com</a>
    </div>
</footer>
