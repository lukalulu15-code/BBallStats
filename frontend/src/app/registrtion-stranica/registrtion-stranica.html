<body>
  <!-- Navigacioni meni -->
  <header>
    <img src="bbballstats_logo.png" alt="logo" class="logo-img" />
    <div align="right">
      <a (click)="pocetna()" class="linkButton">Početna</a>
      <a (click)="loginForm()" class="linkButton">Prijavi se</a>
    </div>
  </header>
  <br>
  <br>
    <div id="initial-loader">
      <img src="bbballstats_logo.png" class="loader-logo" alt="Logo" />
    </div>
  <!-- Glavni sadržaj -->
  <div class="app-wrapper">

  <main class="app-content">
  <div class="login-container">
  <div class="login-box">
    <!-- Logotip ili Naziv aplikacije -->
    <div class="login-header" align="center">
        <span><img src="bbballstats_logo.png" alt="logo" class="logo-img-login"></span>
    </div>

    <!-- Forma -->
    <div class="login-form">
      <!-- Polje za Email -->
      <div class="input-group">
        <input type="email" id="email" required placeholder=" " [(ngModel)]="mejlT">
        <label for="email">E-mail adresa</label>
        <div class="input-line"></div>
      </div>
      <div class="input-group">
        <input type="text" id="korisnickoIme" required placeholder=" " [(ngModel)]="korisnickoImeT">
        <label>Korisničko ime</label>
        <div class="input-line"></div>
      </div>
      <!-- Polje za Lozinku -->
      <div class="input-group">
        <input type="password" id="password" required placeholder=" " [(ngModel)]="lozinkaT">
        <label for="password">Lozinka</label>
        <div class="input-line"></div>
      </div>
      <div class="input-group">
        <input type="password" id="passwordConfirmation" required placeholder=" " [(ngModel)]="potvrdaLozinkeT">
        <label for="password">Potvrdi lozinku</label>
        <div class="input-line"></div>
      </div>
      <div class="input-group">
        <input type="text" id="ime" required placeholder=" " [(ngModel)]="imeT">
        <label>Ime</label>
        <div class="input-line"></div>
      </div>
      <div class="input-group">
        <input type="text" id="prezime" required placeholder=" " [(ngModel)]="prezimeT">
        <label>Prezime</label>
        <div class="input-line"></div>
      </div>
      <div class="input-group">
        <input type="text" id="telefon" required placeholder=" " [(ngModel)]="telefonT">
        <label>Broj telefona</label>
        <div class="input-line"></div>
      </div>
      <div class="input-group">
        <input type="text" id="klub" required placeholder=" " [(ngModel)]="klubT">
        <label>Klub</label>
        <div class="input-line"></div>
      </div>
      <div class="input-group file-group">
        <input type="file" id="slika" class="file-input" (change)="slikaTrener($event)">
        <label for="slika" class="file-label" [class.dragover]="isDragging" (dragover)="naDragOver($event)"
          (dragleave)="naDragLeave()" (drop)="naDrop($event)">
          <span class="label-text">Dodajte profilnu sliku</span>
        </label>
        <div class="input-line"></div>
      </div>
      <!-- Dugme za prijavu -->
       <div align="center">
            <button (click)="register()">Registruj se</button>
       </div>
       <br>
       <div align="center" class="message">{{message}}</div>
    </div>
  </div>
</div>
  </main>

  </div>

</body>
<footer>
    <div align="left">
        <img src="bbballstats_logo.png" alt="logo" class="logo-img" />
    </div>
    <div align = "center">
        &copy; BBallStats, 2026
    </div>
    <div class="footer-contact">
        <a href="tel:+381637348678" class="linkButton"> <img src="logoPhone_white.png" alt="logoPhone_white" class="email-icon"> +381628421563 </a> <br>
        <a href="mailto:gumaplast@gmail.com" class="linkButton"> <img src="logoMail_white.png" alt="logoMail_white" class="email-icon"> bballstatsinfo@gmail.com</a>
    </div>
</footer>

<router-outlet></router-outlet>
